name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: landscape-build
  cancel-in-progress: false

jobs:
  build:
    runs-on:
      labels: ubuntu-latest
    container:
      image: public.ecr.aws/g6m3a0y9/landscape2
      options: --user root
    steps:
      - name: Install git
        run: apk add git

      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Build landscape
        run: |
          landscape2 build \
            --settings-file ./settings.yml \
            --guide-file ./guide.yml \
            --data-file ./data.yml \
            --logos-path ./logos \
            --output-dir /tmp/landscape

      - name: Commit built landscape to build branch
        run: |
          git config --global safe.directory `pwd`
          git config --global user.name "GitHub Actions"
          git config --global user.email "no-reply@sample-domain.io"
          if git fetch --quiet origin refs/heads/build:refs/remotes/origin/build; then
            git checkout -B build origin/build
          else
            git checkout -b build
          fi
          git rm -rf .
          cp -R /tmp/landscape/. .
          cp index.html 404.html
          git add -A
          if git diff --cached --quiet; then
            echo "Generated landscape is unchanged"
            exit 0
          fi
          git commit -m "Build landscape"
          git push origin build
